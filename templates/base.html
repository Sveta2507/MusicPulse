<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Інтерактивний каталог сучасної української музики на основі Wikidata">
  <title>{% block title %}UA Music Pulse{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="{{ url_for('pages.index') }}" aria-label="UA Music Pulse — головна">
      <span class="brand-mark">UA</span>
      <span>MUSIC <b>PULSE</b></span>
    </a>
    <nav aria-label="Головна навігація">
      <a class="nav-link {% if request.endpoint == 'pages.index' %}active{% endif %}" href="{{ url_for('pages.index') }}">Каталог</a>
      <a class="nav-link {% if request.endpoint == 'pages.about' %}active{% endif %}" href="{{ url_for('pages.about') }}">Про проєкт</a>
      <a class="nav-pill" href="https://www.wikidata.org/" target="_blank" rel="noreferrer">Wikidata ↗</a>
    </nav>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <div><span class="brand-mark small">UA</span> Відкриті дані. Жива сцена.</div>
    <div>Денисенко Світлана · ІПЗм-11 · 2026</div>
  </footer>

  {% block dialogs %}{% endblock %}
</body>
</html>
